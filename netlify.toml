[build]
  command = "npm run build"

# Netlify's native Next.js support handles the publish output automatically.
# Netlify builds must never deploy Convex functions. Convex deployments use the
# explicit, manually dispatched GitHub development workflow with a dev-scoped
# key verified for quick-fox-785.

# All Netlify contexts are compile-only; the production context must not deploy
# Convex as a side effect of building the website.
# Recreate Preview #24 when its deploy artifact has been deleted; changing this
# file creates a real configuration commit for Netlify's Git-based deploy hook.
[context.deploy-preview]
  command = "npx next build"

# Keep PR previews isolated from production while exercising the test backend.
# This public Convex URL contains no credentials; production deploys remain unchanged.
[context.deploy-preview.environment]
  NEXT_PUBLIC_CONVEX_URL = "https://quick-fox-785.convex.cloud"

