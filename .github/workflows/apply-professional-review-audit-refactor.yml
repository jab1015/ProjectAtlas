name: Apply professional review audit refactor

on:
  push:
    branches:
      - inventsmith/full-product-build
    paths:
      - scripts/apply-professional-review-audit-refactor.py
      - .github/workflows/apply-professional-review-audit-refactor.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/apply-professional-review-audit-refactor.py
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc -p convex --noEmit
      - run: npx vitest run src/__tests__/professional-review-logic.regression.test.ts src/__tests__/deliverable-persistence.regression.test.ts
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/inventionWorkspace.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: require auditable professional review records"
            git push origin HEAD:inventsmith/full-product-build
          fi
