name: Apply InventSmith documentation normalization
on:
  push:
    branches:
      - inventsmith/full-product-build
    paths:
      - .github/workflows/apply-inventsmith-doc-normalization.yml
      - scripts/apply-inventsmith-stage-docs.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-inventsmith-stage-docs.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGE_BLUEPRINTS docs/RELEASE_MANAGEMENT
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: normalize remaining InventSmith product documents"
          git push origin HEAD:inventsmith/full-product-build
