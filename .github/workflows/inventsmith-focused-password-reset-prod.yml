name: InventSmith Focused Password Reset Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY INVENTSMITH PASSWORD RESET to confirm'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inventsmith-focused-password-reset-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm }}" != "DEPLOY INVENTSMITH PASSWORD RESET" ]]; then
            echo "Refusing deployment: confirmation text did not match."
            exit 1
          fi

      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build
          fetch-depth: 0
          persist-credentials: false

      - name: Verify focused password-reset source
        shell: bash
        run: |
          test -f convex/auth.ts
          grep -q 'inventsmith-password-reset' convex/auth.ts
          grep -q 'AUTH_RESEND_KEY' convex/auth.ts

      - name: Checkout production backend baseline
        shell: bash
        run: |
          git fetch origin main --depth=1
          rm -rf /tmp/inventsmith-focused-convex
          mkdir -p /tmp/inventsmith-focused-convex
          git archive origin/main | tar -x -C /tmp/inventsmith-focused-convex
          cp convex/auth.ts /tmp/inventsmith-focused-convex/convex/auth.ts
          cp package.json /tmp/inventsmith-focused-convex/package.json
          cp package-lock.json /tmp/inventsmith-focused-convex/package-lock.json

      - name: Install production baseline dependencies
        working-directory: /tmp/inventsmith-focused-convex
        run: npm ci

      - name: Deploy focused Convex backend to production
        working-directory: /tmp/inventsmith-focused-convex
        run: npx convex deploy --typecheck enable --codegen enable --message "Focused InventSmith password-reset auth deployment from inventsmith/full-product-build"

      - name: Verify deployment target
        shell: bash
        run: |
          test -n "$CONVEX_DEPLOY_KEY"
          echo "Focused Convex password-reset deployment completed for agile-seahorse-379."
          echo "Production functions and data were preserved by deploying the main backend baseline plus convex/auth.ts only."
