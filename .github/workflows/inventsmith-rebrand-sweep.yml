name: InventSmith Rebrand Sweep

on:
  push:
    branches:
      - inventsmith/brand-audit
    paths:
      - scripts/finish-inventsmith-rebrand.mjs
      - .github/workflows/inventsmith-rebrand-sweep.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: inventsmith/brand-audit
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply InventSmith sweep
        run: node scripts/finish-inventsmith-rebrand.mjs
      - name: Typecheck web
        run: npx tsc --noEmit
      - name: Typecheck Convex
        run: npx tsc -p convex --noEmit
      - name: Regression tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Next production build
        run: npm run build
      - name: Commit verified rebrand sweep
        run: |
          if git diff --quiet; then
            echo "No sweep changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src convex
          git commit -m "Finish InventSmith source rebrand sweep"
          git push origin HEAD:inventsmith/brand-audit
