name: Phase 1 worker guard patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-worker-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build

      - name: Apply pre-provider attempt guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Patch anchor not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'convex/atlasWorkState.ts',
              'export const getWorkContext = internalQuery({\n  args: { workItemId: v.id("atlasWorkItems") },\n  handler: async (ctx, { workItemId }) => {\n    const workItem = await ctx.db.get(workItemId);\n    if (!workItem) throw new ConvexError("Work item not found");',
              'export const getWorkContext = internalQuery({\n  args: { workItemId: v.id("atlasWorkItems"), attemptNumber: v.number(), now: v.number() },\n  handler: async (ctx, { workItemId, attemptNumber, now }) => {\n    const workItem = await ctx.db.get(workItemId);\n    if (!workItem) throw new ConvexError("Work item not found");\n    if (workItem.status !== "running" || workItem.attemptCount !== attemptNumber) throw new ConvexError("Work attempt is no longer current");\n    if (workItem.leaseExpiresAt && workItem.leaseExpiresAt <= now) throw new ConvexError("Work attempt lease expired before provider execution");'
          )

          replace(
              'convex/atlasWorkOrchestration.ts',
              'const getWorkContext = makeFunctionReference<"query", { workItemId: Id<"atlasWorkItems"> }, any>("atlasWorkState:getWorkContext");',
              'const getWorkContext = makeFunctionReference<"query", { workItemId: Id<"atlasWorkItems">; attemptNumber: number; now: number }, any>("atlasWorkState:getWorkContext");'
          )
          replace(
              'convex/atlasWorkOrchestration.ts',
              'const { workItem, invention, record, sources, findings, deliverables } = await ctx.runQuery(getWorkContext, { workItemId: claim.workItemId });',
              'const { workItem, invention, record, sources, findings, deliverables } = await ctx.runQuery(getWorkContext, { workItemId: claim.workItemId, attemptNumber, now: Date.now() });'
          )

          replace(
              'convex/nativeCad.ts',
              'export const getNativeCadContext = internalQuery({\n  args: { inventionId: v.id("inventions"), workItemId: v.id("atlasWorkItems") },\n  handler: async (ctx, args) => {\n    const invention = await ctx.db.get(args.inventionId);\n    const workItem = await ctx.db.get(args.workItemId);\n    if (!invention || !workItem || workItem.inventionId !== args.inventionId || workItem.kind !== "native_cad_generation") throw new ConvexError("Native CAD work context not found");',
              'export const getNativeCadContext = internalQuery({\n  args: { inventionId: v.id("inventions"), workItemId: v.id("atlasWorkItems"), attemptNumber: v.number(), now: v.number() },\n  handler: async (ctx, args) => {\n    const invention = await ctx.db.get(args.inventionId);\n    const workItem = await ctx.db.get(args.workItemId);\n    if (!invention || !workItem || workItem.inventionId !== args.inventionId || workItem.kind !== "native_cad_generation") throw new ConvexError("Native CAD work context not found");\n    if (workItem.status !== "running" || workItem.attemptCount !== args.attemptNumber) throw new ConvexError("Native CAD work attempt is no longer current");\n    if (workItem.leaseExpiresAt && workItem.leaseExpiresAt <= args.now) throw new ConvexError("Native CAD work attempt lease expired before provider execution");'
          )

          replace(
              'convex/nativeCadGeneration.ts',
              'const getNativeCadContext = makeFunctionReference<"query", { inventionId: Id<"inventions">; workItemId: Id<"atlasWorkItems"> }, any>("nativeCad:getNativeCadContext");',
              'const getNativeCadContext = makeFunctionReference<"query", { inventionId: Id<"inventions">; workItemId: Id<"atlasWorkItems">; attemptNumber: number; now: number }, any>("nativeCad:getNativeCadContext");'
          )
          replace(
              'convex/nativeCadGeneration.ts',
              'const context = await ctx.runQuery(getNativeCadContext, { inventionId: args.inventionId, workItemId: args.workItemId });',
              'const context = await ctx.runQuery(getNativeCadContext, { inventionId: args.inventionId, workItemId: args.workItemId, attemptNumber: args.attemptNumber, now: Date.now() });'
          )

          test = Path('src/__tests__/worker-pre-provider-lease.regression.test.ts')
          test.write_text('''import { describe, expect, it } from "vitest";\nimport { readFileSync } from "node:fs";\nimport { join } from "node:path";\n\nfunction source(path: string) {\n  return readFileSync(join(process.cwd(), path), "utf8");\n}\n\ndescribe("pre-provider worker lease guards", () => {\n  it("requires current attempt ownership and an unexpired lease before general provider execution", () => {\n    const state = source("convex/atlasWorkState.ts");\n    const orchestration = source("convex/atlasWorkOrchestration.ts");\n    expect(state).toContain('workItem.status !== "running" || workItem.attemptCount !== attemptNumber');\n    expect(state).toContain('workItem.leaseExpiresAt <= now');\n    expect(state).toContain('lease expired before provider execution');\n    expect(orchestration).toContain('attemptNumber, now: Date.now()');\n    expect(orchestration.indexOf('ctx.runQuery(getWorkContext')).toBeLessThan(orchestration.indexOf('client.responses.create'));\n  });\n\n  it("rechecks native CAD ownership immediately before its provider call", () => {\n    const state = source("convex/nativeCad.ts");\n    const generation = source("convex/nativeCadGeneration.ts");\n    expect(state).toContain('workItem.attemptCount !== args.attemptNumber');\n    expect(state).toContain('workItem.leaseExpiresAt <= args.now');\n    expect(state).toContain('Native CAD work attempt lease expired before provider execution');\n    expect(generation).toContain('attemptNumber: args.attemptNumber, now: Date.now()');\n    expect(generation.indexOf('ctx.runQuery(getNativeCadContext')).toBeLessThan(generation.indexOf('client.responses.create'));\n  });\n});\n''')
          PY

      - name: Verify patch
        run: |
          npm ci
          npx tsc --noEmit
          npx tsc -p convex --noEmit
          npm test -- --run src/__tests__/worker-pre-provider-lease.regression.test.ts src/__tests__/work-orchestrator.regression.test.ts

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Worker guard patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/atlasWorkState.ts convex/atlasWorkOrchestration.ts convex/nativeCad.ts convex/nativeCadGeneration.ts src/__tests__/worker-pre-provider-lease.regression.test.ts
          git commit -m "fix: reject expired workers before provider calls"
          git push origin HEAD:inventsmith/full-product-build
