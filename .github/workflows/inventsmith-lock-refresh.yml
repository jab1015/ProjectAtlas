name: InventSmith Lock Refresh

on:
  push:
    branches: [inventsmith/full-product-build]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Guard lockfile-only diff
        shell: bash
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [ -z "$changed" ]; then
            echo "No lockfile change required."
            exit 0
          fi
          if [ "$changed" != "package-lock.json" ]; then
            echo "Refusing to commit unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for patched dependencies"
          git push origin HEAD:refs/heads/inventsmith/full-product-build
