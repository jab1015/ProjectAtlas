name: InventSmith Lock Refresh

on:
  push:
    branches: [inventsmith/full-product-build]

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: inventsmith-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
