name: InventSmith Convex Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY INVENTSMITH PROD to confirm a production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inventsmith-convex-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          if [[ "${{ inputs.confirm }}" != "DEPLOY INVENTSMITH PROD" ]]; then
            echo "Refusing deployment: confirmation text did not match."
            exit 1
          fi

      - name: Require a production-scoped Convex key
        shell: bash
        run: |
          if [[ -z "$CONVEX_DEPLOY_KEY" ]]; then
            echo "Refusing deployment: CONVEX_DEPLOY_KEY is not configured."
            exit 1
          fi
          if [[ "$CONVEX_DEPLOY_KEY" != prod:* ]]; then
            echo "Refusing deployment: the repository secret is not production-scoped."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Convex
        run: npx tsc -p convex --noEmit

      - name: Regression tests
        run: npm test

      - name: Deploy Convex production backend
        run: npx convex deploy
