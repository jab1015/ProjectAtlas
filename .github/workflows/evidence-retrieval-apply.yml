name: Apply evidence retrieval patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build
      - run: |
          python scripts/apply-evidence-retrieval-patch.py
          python scripts/fix-evidence-retrieval-import.py
      - run: |
          npm ci
          npx tsc --noEmit
          npx tsc -p convex --noEmit
          npm test -- --run src/__tests__/web-retrieval-evidence.regression.test.ts src/__tests__/evidence-integrity.regression.test.ts src/__tests__/work-orchestrator.regression.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add convex/webRetrievalEvidenceLogic.ts convex/atlasWorkOrchestration.ts convex/atlasWorkState.ts src/__tests__/web-retrieval-evidence.regression.test.ts
          git commit -m "fix: bind evidence trust to provider web retrieval"
          git push origin HEAD:inventsmith/full-product-build
