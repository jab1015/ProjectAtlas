name: Normalize InventSmith document prose
on:
  push:
    branches:
      - inventsmith/full-product-build
    paths:
      - .github/workflows/normalize-inventsmith-doc-prose.yml
      - scripts/normalize-inventsmith-doc-prose.py
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inventsmith/full-product-build
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/normalize-inventsmith-doc-prose.py
      - name: Commit normalized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "docs: normalize active InventSmith document prose"
          git push origin HEAD:inventsmith/full-product-build
