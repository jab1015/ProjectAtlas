name: InventSmith Development Audit Diagnostic

on:
  push:
    branches: [inventsmith/full-product-build]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Simulate safe audit repair
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          git status --short

      - name: Report remaining full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high
          status=$?
          echo "Full dependency audit exit code after safe repair: $status"
          exit 0
