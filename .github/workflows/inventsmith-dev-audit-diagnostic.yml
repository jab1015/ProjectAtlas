name: InventSmith Development Audit Diagnostic

on:
  push:
    branches: [inventsmith/full-product-build]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Require clean production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Allow only the unpatched braces lint-tool chain
        shell: bash
        run: |
          npm audit --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const allowed = new Set([
            'braces',
            'micromatch',
            'fast-glob',
            '@next/eslint-plugin-next',
            'eslint-config-next',
          ]);
          const names = Object.keys(report.vulnerabilities || {});
          const unexpected = names.filter((name) => !allowed.has(name));
          if (unexpected.length) {
            console.error(`Unexpected audit findings remain: ${unexpected.join(', ')}`);
            process.exit(1);
          }
          console.log(`Remaining full-audit packages: ${names.length ? names.join(', ') : 'none'}`);
          NODE

      - name: Guard lockfile-only diff
        shell: bash
        run: |
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          if [ -z "$changed" ]; then
            echo "No lockfile change required."
            exit 0
          fi
          if [ "$changed" != "package-lock.json" ]; then
            echo "Refusing to commit unexpected changed paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate lockfile for development security patches"
          git push origin HEAD:refs/heads/inventsmith/full-product-build
